# Тема закреплена светлой: цвета графиков проверены на контраст и различимость
# при дальтонизме именно для светлого фона
[theme]
base = "light"
primaryColor = "#256abf"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]
chartSequentialColors = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#2a78d6", "#1c5cab", "#104281", "#0d366b"]

[browser]
gatherUsageStats = false
